sylius_grid:
    grids:
        setono_sylius_google_ads_admin_merchant_mapping:
            driver:
                name: doctrine/orm
                options:
                    class: "%setono_sylius_google_ads.model.merchant_mapping.class%"
            limits: [100, 200, 500, 1000]
            fields:
                channel:
                    type: twig
                    label: sylius.ui.channel
                    sortable: channel.code
                    options:
                        template: "@SyliusAdmin/Order/Grid/Field/channel.html.twig"
                merchantId:
                    type: string
                    label: setono_sylius_google_ads.ui.merchant_id
                    sortable: ~
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
