        map_merchants_help:
            heading: Map between channel and merchant
            body: |
                <p>You should have a mapping between each channel that receives traffic from Google Ads and a related merchant.</p>
                <p>This allows the plugin to automatically send cart to Google Ads as well.</p>
                <p>You will find the merchant center id inside your Google Merchant center by clicking on your account name in the upper right corner. See the image below:</p>
        merchant_id: Merchant id
        merchant_mappings: Merchant mappings
